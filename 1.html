<!DOCTYPE html>
<html lang="zh-CN">
  <body>
    <div class="app">
      <div class="topbar">
        <div class="logo">Q</div>
        <div class="title">随笔问答</div>
      </div>
      <!-- 发布器 -->
      <div class="composer">
        <div class="composer-row">
          <div class="avatar" style="background-image: url(''); background-size: cover"></div>
          <div class="composer-body">
            <select id="postType">
              <option value="感悟">感悟</option>
              <option value="自问自答">自问自答</option>
              <option value="面试题">面试题</option>
            </select>
            <textarea id="question" placeholder="如果是“自问自答/面试题”，可填写问题（可选）"></textarea>
            <textarea id="content" placeholder="写下你的回答/感悟..." rows="3"></textarea>

            <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px; justify-content: space-between">
              <div>
                <input type="file" id="imgInput" accept="image/*" multiple style="display: none" />
                <button
                  class="btn"
                  id="imgBtn"
                  style="background: #f2f6fa; color: #1677ff; padding: 6px 10px; border-radius: 8px"
                >
                  添加图片
                </button>
                <span id="imgCount" style="color: var(--muted); margin-left: 8px"></span>
              </div>
              <button class="btn" id="publishBtn" disabled>发布</button>
            </div>

            <div class="img-preview" id="preview"></div>
          </div>
        </div>
      </div>

      <!-- Feed -->
      <div class="feed" id="feed"></div>
      <div class="load-more" id="loadMore">加载更多…</div>
    </div>
    <!-- 图片 Modal -->
    <div class="modal" id="modal">
      <div
        style="position: absolute; left: 12px; top: 12px; color: #fff; font-size: 18px; cursor: pointer"
        id="modalClose"
      >
        ✕
      </div>
      <div class="slide"><img id="modalImg" src="" alt="" /></div>
    </div>
    <script>
      // 简化 demo 数据与渲染逻辑（可扩展为调用 API）
      const feedEl = document.getElementById("feed");
      const publishBtn = document.getElementById("publishBtn");
      const imgBtn = document.getElementById("imgBtn");
      const imgInput = document.getElementById("imgInput");
      const preview = document.getElementById("preview");
      const imgCount = document.getElementById("imgCount");
      const loadMore = document.getElementById("loadMore");
      const modal = document.getElementById("modal");
      const modalImg = document.getElementById("modalImg");
      const modalClose = document.getElementById("modalClose");
      let posts = []; // 全部 posts（模拟）
      let page = 0;
      const PAGE_SIZE = 5; // 预置一些模拟数据
      function seedData() {
        const sampleImgs = [
          "https://picsum.photos/seed/1/800/600",
          "https://picsum.photos/seed/2/800/600",
          "https://picsum.photos/seed/3/800/600",
          "https://picsum.photos/seed/4/800/600",
          "https://picsum.photos/seed/5/800/600",
          "https://picsum.photos/seed/6/800/600",
          "https://picsum.photos/seed/7/800/600",
          "https://picsum.photos/seed/8/800/600",
        ];
        for (let i = 0; i < 18; i++) {
          posts.push({
            id: "p" + i,
            author: { name: i % 3 === 0 ? "小明" : i % 3 === 1 ? "小红" : "我", avatar: "" },
            createdAt: Date.now() - i * 3600 * 1000,
            type: i % 4 === 0 ? "面试题" : i % 3 === 0 ? "自问自答" : "感悟",
            question: i % 4 === 0 ? "请解释闭包是什么？" : i % 5 === 0 ? "这是一个示例问题" : "",
            content: "这是示例内容，第 " + i + " 条，分享一些心得体会或回答。".repeat(1 + (i % 3)),
            images: sampleImgs.slice(0, i % 5),
            likes: Math.floor(Math.random() * 20),
            likedByMe: false,
            comments: [],
          });
        }
      }
      seedData(); // 渲染一页
      //
      function renderPage() {
        const start = page * PAGE_SIZE;
        const slice = posts.slice(start, start + PAGE_SIZE);
        slice.forEach((p) => feedEl.appendChild(renderPost(p)));
        page++;
        if (page * PAGE_SIZE >= posts.length) loadMore.textContent = "没有更多了";
      } // 渲染单条 post
      //
      function renderPost(p) {
        const el = document.createElement("div");
        el.className = "post";
        el.dataset.id = p.id; // head
        //
        const head = document.createElement("div");
        head.className = "head";
        head.innerHTML = `<div style="width:44px;height:44px;border-radius:50%;background:#ddd;flex:0 0 44px"></div> <div class="meta"> <div class="name">${
          p.author.name
        }</div> <div class="time">${timeAgo(p.createdAt)}</div> </div> <div class="tag">${p.type}</div>`;
        el.appendChild(head); // question
        //
        if (p.question) {
          const q = document.createElement("div");
          q.className = "question";
          q.textContent = p.question;
          el.appendChild(q);
        } // content
        //
        const content = document.createElement("div");
        content.className = "content" + (p.content.length > 200 ? " collapsed" : "");
        content.textContent = p.content;
        el.appendChild(content);
        if (p.content.length > 200) {
          const expand = document.createElement("button");
          expand.className = "expand-btn";
          expand.textContent = "展开";
          expand.onclick = () => {
            content.classList.remove("collapsed");
            expand.style.display = "none";
          };
          el.appendChild(expand);
        } // images grid
        //
        if (p.images && p.images.length > 0) {
          const grid = document.createElement("div");
          const n = p.images.length;
          grid.className =
            "img-grid " + (n === 1 ? "one" : n === 2 ? "two" : n === 3 ? "three" : n === 4 ? "four" : "three"); // 设置 row heights for one big image
          //
          if (n === 1) {
            grid.style.gridAutoRows = "minmax(160px, 360px)";
          } else {
            grid.style.gridAutoRows = "120px";
          }
          p.images.forEach((src, idx) => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "图片";
            img.onclick = () => openModal(src);
            grid.appendChild(img);
          });
          el.appendChild(grid);
        } // actions
        //
        const actions = document.createElement("div");
        actions.className = "actions";
        const likeBtn = document.createElement("button");
        likeBtn.className = "action-btn" + (p.likedByMe ? " liked" : "");
        likeBtn.innerHTML = `👍 <span class="count">${p.likes}</span>`;
        likeBtn.onclick = () => {
          p.likedByMe = !p.likedByMe;
          p.likes += p.likedByMe ? 1 : -1;
          likeBtn.classList.toggle("liked", p.likedByMe);
          likeBtn.querySelector(".count").textContent = p.likes;
        };
        const commentBtn = document.createElement("button");
        commentBtn.className = "action-btn";
        commentBtn.innerHTML = `💬 <span class="count">${p.comments.length}</span>`;
        commentBtn.onclick = () => openCommentInput(p, el);
        actions.appendChild(likeBtn);
        actions.appendChild(commentBtn);
        el.appendChild(actions); // comments (简化显示)
        //
        const commentsWrap = document.createElement("div");
        commentsWrap.className = "comments";
        p.comments.forEach((c) => {
          const cm = document.createElement("div");
          cm.className = "comment";
          cm.textContent = c.author.name + ": " + c.text;
          commentsWrap.appendChild(cm);
        });
        el.appendChild(commentsWrap);
        return el;
      } // 时间显示
      //
      function timeAgo(ts) {
        const s = Math.floor((Date.now() - ts) / 1000);
        if (s < 60) return s + "秒前";
        if (s < 3600) return Math.floor(s / 60) + "分钟前";
        if (s < 86400) return Math.floor(s / 3600) + "小时前";
        return Math.floor(s / 86400) + "天前";
      } // 图片 modal
      //
      function openModal(src) {
        modalImg.src = src;
        modal.classList.add("show");
      }
      function closeModal() {
        modal.classList.remove("show");
        modalImg.src = "";
      }
      modalClose.onclick = closeModal;
      modal.onclick = (e) => {
        if (e.target === modal) closeModal();
      }; // 评论输入（简化为 prompt）
      //
      function openCommentInput(post, postEl) {
        const text = prompt("填写评论");
        if (text) {
          const c = { id: Date.now(), author: { name: "我" }, text, createdAt: Date.now() };
          post.comments.push(c); // 更新评论显示（重新渲染该卡片简化处理）
          //
          const newEl = renderPost(post);
          postEl.replaceWith(newEl);
        }
      } // 加载更多
      //
      loadMore.onclick = () => {
        renderPage();
      }; // 发布逻辑（图片使用 DataURL）
      //
      const questionEl = document.getElementById("question");
      const contentEl = document.getElementById("content");
      const postTypeEl = document.getElementById("postType");
      let selectedImages = [];
      imgBtn.onclick = () => imgInput.click();
      imgInput.onchange = (e) => {
        const files = Array.from(e.target.files).slice(0, 9); // 最多 9 张
        //
        selectedImages = [];
        preview.innerHTML = "";
        if (files.length) {
          files.forEach((file) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const url = ev.target.result;
              selectedImages.push(url);
              const img = document.createElement("img");
              img.src = url;
              preview.appendChild(img);
            };
            reader.readAsDataURL(file);
          });
        }
        imgCount.textContent = files.length ? files.length + " 张" : "";
        checkPublishEnable();
      };
      function checkPublishEnable() {
        publishBtn.disabled = !(
          contentEl.value.trim().length > 0 ||
          selectedImages.length > 0 ||
          questionEl.value.trim().length > 0
        );
      }
      questionEl.oninput = contentEl.oninput = checkPublishEnable;
      publishBtn.onclick = () => {
        const newPost = {
          id: "pnew" + Date.now(),
          author: { name: "我", avatar: "" },
          createdAt: Date.now(),
          type: postTypeEl.value,
          question: questionEl.value.trim() || "",
          content: contentEl.value.trim(),
          images: selectedImages.slice(),
          likes: 0,
          likedByMe: false,
          comments: [],
        }; // 插到最前并重新渲染简单处理：把新 post 放到 posts 前，并重置分页与 feed
        //
        posts.unshift(newPost); // reset feed
        //
        page = 0;
        feedEl.innerHTML = "";
        renderPage(); // 清空 composer
        //
        questionEl.value = "";
        contentEl.value = "";
        selectedImages = [];
        preview.innerHTML = "";
        imgInput.value = "";
        imgCount.textContent = "";
        publishBtn.disabled = true; // 滚动到顶部
        //
        window.scrollTo({ top: 0, behavior: "smooth" });
      }; // 初始加载
      //
      renderPage(); // 下拉加载更多（滚动到底部）
      //
      window.addEventListener("scroll", () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 120) {
          // 如果还有更多
          //
          if (page * PAGE_SIZE < posts.length) {
            renderPage();
          }
        }
      });
    </script>
  </body>
</html>
